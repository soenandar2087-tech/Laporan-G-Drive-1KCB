<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dokumen 1KCB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--border:#cbd5e0;--text:#1f2937;--muted:#6b7280;--danger:#ef4444;--success:#10b981;--drive:#4285F4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:8px;font-size:13px;color:var(--text);background:#f1f5f9}
.app{border:2px solid var(--primary);border-radius:12px;background:#fff;overflow:hidden;max-width:480px;margin:0 auto}
.head{padding:12px 14px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-bottom:2px solid var(--primary)}
.head h1{font-size:16px;font-weight:800;color:var(--primary-dark)}
.body{padding:12px}
.box{background:#fffbeb;border:1.5px solid #fbbf24;border-radius:8px;padding:10px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:6px 0 4px;display:block}
select{width:100%;padding:9px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:#fff;margin-bottom:4px}
.send-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:800;background:var(--drive);touch-action:manipulation}
.send-btn:disabled{opacity:.5}
.send-btn.st-done{background:var(--success)}
.status{font-size:11px;color:var(--muted);text-align:center;margin:8px 0;min-height:16px}

/* Hasil Upload - Tengah Layar */
#resultBox{display:none;padding:16px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;margin-top:12px;text-align:center}
.result-title{font-size:15px;font-weight:700;color:#166534;margin-bottom:6px}
.result-path{font-size:12px;color:#166534;margin-bottom:12px;line-height:1.5}
.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result-btn{padding:10px 16px;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
.result-btn.primary{background:var(--primary);color:#fff}
.result-btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;z-index:3000;font-weight:700;max-width:90vw;text-align:center;transition:.25s}
.toast.show{opacity:1}.toast.err{background:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>📁 Dokumen 1KCB</h1>
  </div>
  <div class="body">

    <div class="box">
      <span class="lbl">📂 Tujuan Penyimpanan</span>
      <span class="lbl">Tahun</span><select id="selTahun"></select>
      <span class="lbl">Bulan</span><select id="selBulan"></select>
      <span class="lbl">Periode</span><select id="selPeriode" disabled><option value="">-- Pilih bulan dulu --</option></select>
      <span class="lbl">Afdeling</span><select id="selAfdeling"></select>
      <span class="lbl">Jenis Dokumen</span><select id="selJenisDoc"></select>
    </div>

    <button class="send-btn" id="btnSend" disabled>☁️ Kirim ke Drive</button>
    <div class="status" id="statusText">Siap.</div>

    <!-- Hasil Upload (Muncul di Tengah) -->
    <div id="resultBox">
      <div class="result-title">✅ Berhasil dikirim!</div>
      <div class="result-path" id="resultPath"></div>
      <div class="result-actions">
        <button class="result-btn primary" onclick="bukaFile()">📄 Buka File</button>
        <button class="result-btn secondary" onclick="newDoc()">🆕 Dokumen Baru</button>
      </div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const {jsPDF}=window.jspdf;
const EP='https://script.google.com/macros/s/AKfycbzNnRc0Cs4nYoLCA5QwUuwyg_3ELfLEd9CoIJoUcjrgTor5uHpBnXbYnO7bW9ucRuE4FQ/exec';
const MO=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PE=['Periode I','Periode II'];
const AF=['Afdeling I','Afdeling II','Afdeling III','Afdeling IV','Afdeling V','Afdeling VI'];
const JD=['Peta Realisasi Pemeliharaan','Dokumentasi Pemeliharaan','Peta Realisasi Pemupukan','Dokumentasi Pemupukan','SP Angkutan Pupuk','Slip Mobilisasi Tenaga Pemupukan','Lampiran Angkutan TBS PKS I','Lampiran Angkutan TBS PKS II','Lampiran Serak Jangkos','SP Angkutan Jangkos','Lampiran Pok TBS','Dokumentasi Mobilisasi Pemeliharaan','Dokumentasi Mobilisasi Pemupukan','Slip Mobilisasi Tenaga Pemeliharaan'];

let photos=[],busy=false,lastFileUrl='',lastFolderUrl='';

const $=id=>document.getElementById(id);
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(0)+' KB';
const pad=n=>String(n).padStart(2,'0');
const clean=s=>String(s).replace(/[\\/:*?"<>|]+/g,'-').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let tT;
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3500);}
function stat(m){$('statusText').textContent=m;}

/* Dropdown */
function fill(el,a,ph){el.innerHTML='<option value="">'+ph+'</option>';a.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});}
(function init(){
  const d=new Date(),y=d.getFullYear(),sT=$('selTahun');
  for(let i=y+1;i>=y-5;i--){const o=document.createElement('option');o.value=i;o.textContent=i;sT.appendChild(o);}
  sT.value=y;
  fill($('selBulan'),MO,'-- Bulan --'); $('selBulan').value=MO[d.getMonth()];
  fill($('selAfdeling'),AF,'-- Afdeling --');
  fill($('selJenisDoc'),JD,'-- Jenis Dokumen --');
  $('selBulan').onchange=onBulan; onBulan();
})();
function onBulan(){const s=$('selPeriode'),b=$('selBulan').value;if(!b){s.disabled=true;s.innerHTML='<option value="">-- Pilih bulan dulu --</option>';}else{s.disabled=false;fill(s,PE,'-- Periode --');}}
function fp(){return{tahun:$('selTahun').value,bulan:$('selBulan').value,periode:$('selPeriode').value,afdeling:$('selAfdeling').value,jenisDoc:$('selJenisDoc').value};}
function sName(){const p=fp(),d=new Date(),st=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());return clean([p.jenisDoc,p.afdeling,p.periode].filter(Boolean).join(' - ')||'laporan')+' - '+st+'.pdf';}

/* Buka File */
function bukaFile(){ if(lastFileUrl) window.open(lastFileUrl,'_blank'); }
function newDoc(){ $('resultBox').style.display='none'; lastFileUrl=''; lastFolderUrl=''; stat('Siap.'); }

/* Kirim */
async function sendToDrive(){
  if(busy) return;
  const p=fp();
  if(!p.tahun||!p.bulan||!p.periode||!p.afdeling||!p.jenisDoc){ toast('❌ Lengkapi semua pilihan',true); return; }

  busy=true; $('resultBox').style.display='none'; stat('☁️ Mengirim...');
  try{
    // Karena tidak ada foto, kita buat PDF kosong sederhana
    const pdf=new jsPDF({unit:'mm',format:'a4'});
    pdf.text('Dokumen 1KCB',105,50,{align:'center'});
    const blob=pdf.output('blob');
    const b64=await new Promise((y,n)=>{const r=new FileReader();r.onload=()=>y(String(r.result).split(',')[1]);r.onerror=()=>n(r.error);r.readAsDataURL(blob);});
    const fn=sName();

    const res=await fetch(EP,{method:'POST',body:JSON.stringify({
      name:fn,mimeType:'application/pdf',data:b64,
      tahun:p.tahun,bulan:p.bulan,periode:p.periode,afdeling:p.afdeling,jenisDoc:p.jenisDoc
    })});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'Gagal');

    lastFileUrl=j.url||'';
    lastFolderUrl=j.folderUrl||'';

    stat('✅ Tersimpan');
    toast('✅ Berhasil dikirim!');
    $('resultBox').style.display='block';
    $('resultPath').innerHTML='📂 '+esc(j.path||'')+'<br><b>'+esc(j.name||fn)+'</b>';
  }catch(e){
    stat('❌ '+e.message); toast('❌ '+e.message,true);
  }
  busy=false;
}

$('btnSend').onclick=sendToDrive;
</script>
</body>
</html>
