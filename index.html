<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Dokumen 1KCB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--panel:#f8fafc;--border:#cbd5e0;--text:#1f2937;--muted:#6b7280;--danger:#ef4444;--success:#10b981;--drive:#4285F4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:6px;padding-bottom:90px;font-size:12px;color:var(--text);background:#f1f5f9;touch-action:manipulation}
.app-wrap{border:2px solid var(--primary);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.app-head{padding:10px 12px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-bottom:2px solid var(--primary)}
.app-head h1{font-size:15px;font-weight:800;color:var(--primary-dark)}
.app-head small{font-size:10px;color:var(--muted)}
.app-body{padding:8px}
.box{background:var(--panel);border:1.5px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px}
.label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:6px 0 3px;display:block}

/* 16px WAJIB: mencegah auto-zoom iOS yang bikin tap meleset */
select{width:100%;padding:11px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:16px;background:#fff;font-family:inherit;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 8px center;background-size:16px;padding-right:30px}
select:disabled{background-color:#f1f5f9;color:#94a3b8}
select:focus{outline:none;border-color:var(--primary)}

/* input disembunyikan TANPA display:none supaya label tetap bisa memicunya di HP */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

#drop{display:block;border:2px dashed #93c5fd;background:#fff;border-radius:10px;padding:26px 10px;text-align:center;cursor:pointer;user-select:none;transition:.12s}
#drop:active{background:#eff6ff;border-color:var(--primary);transform:scale(.985)}
#drop.busy{opacity:.5;pointer-events:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:3/4;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;background:#eee;touch-action:manipulation}
.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.thumb-num{position:absolute;top:3px;left:3px;background:var(--primary);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700}
.thumb-del{position:absolute;top:2px;right:2px;width:26px;height:26px;background:rgba(239,68,68,.95);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.thumb.sortable-chosen{opacity:.7;transform:scale(1.05)}
#emptyMsg{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;gap:4px}

.actions{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1.5px solid var(--border);z-index:20;backdrop-filter:blur(6px)}
.btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:14px 8px;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;user-select:none;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-cam{background:#f59e0b;color:#fff}
.btn-drive{background:var(--drive);color:#fff}
.btn[aria-disabled="true"],.btn:disabled{opacity:.42;pointer-events:none}

.progress-container{height:5px;background:#e5e7eb;border-radius:3px;margin-top:8px;display:none;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);width:0%;transition:.15s}
.status-text{font-size:11px;color:var(--muted);text-align:center;margin-top:5px;min-height:14px}
#resultBox{display:none;margin-top:8px;padding:10px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;font-size:11px;text-align:center;line-height:1.7}
#resultBox a{color:var(--primary-dark);font-weight:700;text-decoration:none}
.new-doc{margin-top:8px;padding:9px 16px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;z-index:100;font-weight:700;max-width:92vw;text-align:center;transition:.25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:12px}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="app-head">
    <h1>📁 Dokumen 1KCB</h1>
    <small>Pilih tujuan → Foto → Kirim</small>
  </div>

  <div class="app-body">
    <div class="box" style="background:#fffbeb;border-color:#fbbf24">
      <span class="label">📂 Tujuan Penyimpanan</span>
      <span class="label">Tahun</span>
      <select id="selTahun"></select>
      <span class="label">Bulan</span>
      <select id="selBulan"></select>
      <span class="label">Periode</span>
      <select id="selPeriode" disabled><option value="">-- Pilih bulan dulu --</option></select>
      <span class="label">Afdeling</span>
      <select id="selAfdeling"></select>
      <span class="label">Jenis Dokumen</span>
      <select id="selJenisDoc"></select>
    </div>

    <div class="box">
      <!-- LABEL native: tidak pakai JS click, jadi tidak diblokir browser HP -->
      <label id="drop" for="fileInput">
        <div style="font-size:32px;margin-bottom:6px">📁</div>
        <div style="font-weight:800;color:var(--primary);font-size:14px">Ketuk untuk Pilih Foto</div>
        <div style="color:var(--muted);font-size:11px;margin-top:4px">Galeri · bisa pilih banyak sekaligus</div>
      </label>

      <input type="file" id="fileInput" class="sr-only" accept="image/*" multiple>
      <input type="file" id="cameraInput" class="sr-only" accept="image/*" capture="environment">

      <div class="grid" id="grid"></div>
      <div id="emptyMsg"><span style="font-size:28px">🖼</span><span>Belum ada foto</span></div>
    </div>

    <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
    <div class="status-text" id="statusText">Siap.</div>
    <div id="resultBox"></div>
  </div>
</div>

<div class="actions">
  <!-- label, bukan button: kamera langsung terbuka di semua HP -->
  <label class="btn btn-cam" for="cameraInput" id="btnCam">📷 Kamera</label>
  <button class="btn btn-drive" id="btnSend" disabled>☁️ Kirim</button>
</div>

<div class="toast" id="toast"></div>

<script>
const {jsPDF}=window.jspdf;
const ENDPOINT='https://script.google.com/macros/s/AKfycbzNnRc0Cs4nYoLCA5QwUuwyg_3ELfLEd9CoIJoUcjrgTor5uHpBnXbYnO7bW9ucRuE4FQ/exec';

const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PERIODES=['Periode I','Periode II'];
const AFDELING=['Afdeling I','Afdeling II','Afdeling III','Afdeling IV','Afdeling V','Afdeling VI'];
const JENIS=['Peta Realisasi Pemeliharaan','Dokumentasi Pemeliharaan','Peta Realisasi Pemupukan','Dokumentasi Pemupukan','SP Angkutan Pupuk','Slip Mobilisasi Tenaga Pemupukan','Lampiran Angkutan TBS PKS I','Lampiran Angkutan TBS PKS II','Lampiran Serak Jangkos','SP Angkutan Jangkos','Lampiran Pok TBS','Dokumentasi Mobilisasi Pemeliharaan','Dokumentasi Mobilisasi Pemupukan','Slip Mobilisasi Tenaga Pemeliharaan'];

const MAX_PX=1800, JPEG_Q=0.72, MAX_FOTO=40;

let photos=[], busy=false, importing=false;

const $=id=>document.getElementById(id);
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(0)+' KB';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s).replace(/[\\/:*?"<>|]+/g,'-').trim();
const pad=n=>String(n).padStart(2,'0');

let tT;
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' error':'');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3200);}
function setStatus(m){$('statusText').textContent=m;}
function setProg(p){$('progCont').style.display='block';$('progBar').style.width=Math.min(100,Math.max(0,p))+'%';}
function hideProg(){setTimeout(()=>{$('progCont').style.display='none';$('progBar').style.width='0%';},1000);}

/* ---------- DROPDOWN ---------- */
function fillSel(el,arr,ph){const cur=el.value;el.innerHTML='<option value="">'+(ph||'-- Pilih --')+'</option>';arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});if(arr.indexOf(cur)>=0)el.value=cur;}
function initDropdowns(){
  const now=new Date(), y=now.getFullYear();
  const sT=$('selTahun'); sT.innerHTML='<option value="">-- Tahun --</option>';
  for(let i=y+1;i>=y-5;i--){const o=document.createElement('option');o.value=i;o.textContent=i;sT.appendChild(o);}
  sT.value=String(y);
  fillSel($('selBulan'),MONTHS,'-- Bulan --'); $('selBulan').value=MONTHS[now.getMonth()];
  fillSel($('selAfdeling'),AFDELING,'-- Afdeling --');
  fillSel($('selJenisDoc'),JENIS,'-- Jenis Dokumen --');
  $('selBulan').addEventListener('change',onBulanChange);
  onBulanChange();
}
function onBulanChange(){
  const sel=$('selPeriode');
  if(!$('selBulan').value){ sel.disabled=true; sel.innerHTML='<option value="">-- Pilih bulan dulu --</option>'; }
  else { const cur=sel.value; sel.disabled=false; fillSel(sel,PERIODES,'-- Periode --'); if(PERIODES.indexOf(cur)>=0) sel.value=cur; }
}
function params(){return{tahun:$('selTahun').value,bulan:$('selBulan').value,periode:$('selPeriode').value,afdeling:$('selAfdeling').value,jenisDoc:$('selJenisDoc').value};}
function pathText(){const p=params();return [p.tahun,p.bulan,p.periode,p.afdeling,p.jenisDoc].filter(Boolean).join(' / ');}
function suggestName(){
  const p=params(), d=new Date();
  const stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
  return clean([p.jenisDoc,p.afdeling,p.periode].filter(Boolean).join(' - ')||'laporan')+' - '+stamp+'.pdf';
}

/* ---------- IMPORT FOTO (langsung dikecilkan, hemat memori HP) ---------- */
async function decodeFile(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  const url=URL.createObjectURL(file);
  try{
    return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode gagal'));i.src=url;});
  } finally { setTimeout(()=>URL.revokeObjectURL(url),2000); }
}

function toCanvas(src,maxPx){
  let w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(Math.max(w,h)>maxPx){const r=maxPx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(src,0,0,w,h);
  return cv;
}

async function handleFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length) return;
  if(importing) return;
  importing=true; $('drop').classList.add('busy'); lockUI(true);

  let ok=0;
  for(let i=0;i<list.length;i++){
    if(photos.length>=MAX_FOTO){ toast('Maksimal '+MAX_FOTO+' foto',true); break; }
    setStatus('Memproses foto '+(i+1)+'/'+list.length+'...');
    setProg((i+1)/list.length*100);
    await wait(0);
    try{
      const bmp=await decodeFile(list[i]);
      const big=toCanvas(bmp,MAX_PX);
      const data=big.toDataURL('image/jpeg',JPEG_Q);
      const small=toCanvas(big,220);
      const thumb=small.toDataURL('image/jpeg',0.6);
      if(bmp.close) bmp.close();
      photos.push({id:'p'+Date.now()+Math.random().toString(36).slice(2),data,thumb,w:big.width,h:big.height,size:Math.round(data.length*0.75)});
      ok++;
      renderGrid();
    }catch(e){ console.error(e); toast('❌ 1 foto gagal dibaca',true); }
  }

  importing=false; $('drop').classList.remove('busy'); lockUI(false);
  renderGrid(); hideProg();
  setStatus(ok?('✅ '+photos.length+' foto siap ('+fmt(photos.reduce((s,p)=>s+p.size,0))+')'):'Tidak ada foto ditambahkan.');
}

$('fileInput').addEventListener('change',e=>{const f=e.target.files;e.target.value='';handleFiles(f);});
$('cameraInput').addEventListener('change',e=>{const f=e.target.files;e.target.value='';handleFiles(f);});

/* drag & drop tetap jalan di laptop */
const dropEl=$('drop');
['dragover','dragenter'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();}));
dropEl.addEventListener('drop',e=>{e.preventDefault();handleFiles(e.dataTransfer.files);});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());

/* ---------- RENDER ---------- */
function lockUI(v){
  $('btnSend').disabled = v || !photos.length;
  $('btnCam').setAttribute('aria-disabled', v?'true':'false');
}
function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  $('emptyMsg').style.display=photos.length?'none':'flex';
  lockUI(busy||importing);
  photos.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='thumb'; d.dataset.id=p.id;
    d.innerHTML='<span class="thumb-num">'+(i+1)+'</span><button class="thumb-del" aria-label="Hapus">×</button><img src="'+p.thumb+'">';
    d.querySelector('.thumb-del').addEventListener('click',ev=>{
      ev.stopPropagation(); ev.preventDefault();
      if(busy||importing) return;
      photos=photos.filter(x=>x.id!==p.id); renderGrid();
    });
    g.appendChild(d);
  });
  if(window.sortInst) window.sortInst.destroy();
  window.sortInst=new Sortable(g,{
    animation:150,
    delay:220, delayOnTouchOnly:true,   // tap ≠ drag, scroll tetap enak di HP
    touchStartThreshold:6,
    filter:'.thumb-del', preventOnFilter:false,
    onEnd:()=>{const ids=[...g.children].map(el=>el.dataset.id);photos.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));renderGrid();}
  });
}

/* ---------- PDF ---------- */
async function buildPdf(){
  let pdf=null;
  for(let i=0;i<photos.length;i++){
    const p=photos[i], land=p.w>p.h;
    if(i===0) pdf=new jsPDF({orientation:land?'l':'p',unit:'mm',format:'a4',compress:true});
    else pdf.addPage('a4',land?'l':'p');
    const PW=pdf.internal.pageSize.getWidth(), PH=pdf.internal.pageSize.getHeight();
    const r=Math.min(PW/p.w,PH/p.h), w=p.w*r, h=p.h*r;
    pdf.addImage(p.data,'JPEG',(PW-w)/2,(PH-h)/2,w,h,undefined,'FAST');
    setStatus('Menyusun PDF '+(i+1)+'/'+photos.length); setProg((i+1)/photos.length*45); await wait(0);
  }
  return pdf;
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('encode gagal'));r.readAsDataURL(b);});

/* ---------- KIRIM ---------- */
$('btnSend').addEventListener('click',sendToDrive);

async function sendToDrive(){
  if(busy||importing||!photos.length) return;
  const p=params();
  if(!p.tahun||!p.bulan||!p.periode||!p.afdeling||!p.jenisDoc){
    toast('Lengkapi Tahun, Bulan, Periode, Afdeling, Jenis',true);
    window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  busy=true; lockUI(true); $('resultBox').style.display='none';
  const fileName=suggestName();

  try{
    const pdf=await buildPdf();
    const blob=pdf.output('blob');
    if(blob.size>22*1048576) throw new Error('PDF terlalu besar ('+fmt(blob.size)+'), kurangi jumlah foto');

    setStatus('☁️ Mengirim '+fmt(blob.size)+'... jangan tutup halaman'); setProg(65);
    const b64=await blobToB64(blob);
    setProg(80);

    const res=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify({
      name:fileName, mimeType:'application/pdf', data:b64,
      tahun:p.tahun, bulan:p.bulan, periode:p.periode, afdeling:p.afdeling, jenisDoc:p.jenisDoc
    })});

    const txt=await res.text();
    let j; try{ j=JSON.parse(txt); }
    catch(e){ j = res.ok ? {ok:true,name:fileName,path:pathText()} : null; }
    if(!j) throw new Error('Respon server tidak valid');
    if(!j.ok) throw new Error(j.error||'Gagal menyimpan');

    setProg(100); setStatus('✅ Tersimpan di Drive'); toast('✅ Berhasil dikirim');
    const rb=$('resultBox'); rb.style.display='block';
    rb.innerHTML='✅ <b>'+esc(j.name||fileName)+'</b><br>📂 '+esc(j.path||pathText())+
      (j.url?'<br><a href="'+esc(j.url)+'" target="_blank" rel="noopener">Buka file ↗</a>':'')+
      '<br><button class="new-doc" id="btnNew">🆕 Dokumen Baru</button>';
    $('btnNew').addEventListener('click',newDoc);
    photos=[]; renderGrid();
  }catch(e){
    setStatus('❌ '+e.message); toast('❌ '+e.message,true);
  }
  busy=false; lockUI(false); renderGrid(); hideProg();
}

function newDoc(){ photos=[]; renderGrid(); $('resultBox').style.display='none'; setStatus('Siap.'); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- INIT ---------- */
initDropdowns(); renderGrid();
window.addEventListener('beforeunload',e=>{ if(busy||photos.length){ e.preventDefault(); e.returnValue=''; } });
</script>
</body>
</html>
